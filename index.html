<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>貪食蛇 3D</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- three.js 放在專案裡，用 import map 讓程式可以直接 import 'three' -->
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js" } }
    </script>
  </head>
  <body>
    <!-- 文字以中文為預設，切換語言時依 data-i18n 系列屬性替換 -->

    <!-- 3D 畫面 -->
    <div id="stage" class="stage" role="img" aria-label="遊戲畫面" data-i18n-aria-label="board.label"></div>

    <header class="topbar">
      <h1 class="title" data-i18n="title">貪食蛇 3D</h1>
      <!-- 語言選項固定用各自的語言顯示，看不懂目前語言的人也找得到 -->
      <div class="lang-switch" role="group" aria-label="語言" data-i18n-aria-label="menu.language">
        <button type="button" class="lang-button" data-lang="zh-TW" lang="zh-TW">中文</button>
        <button type="button" class="lang-button" data-lang="en" lang="en">English</button>
      </div>
    </header>

    <!-- 瀏覽器不支援 WebGL 2 時顯示 -->
    <div id="no-webgl" class="notice" hidden>
      <div class="panel">
        <h2 class="panel-title" data-i18n="noWebgl.title">無法顯示 3D 畫面</h2>
        <p class="panel-text" data-i18n="noWebgl.message">
          這個瀏覽器不支援 WebGL 2，請改用最新版的 Chrome、Edge、Firefox 或 Safari。
        </p>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
